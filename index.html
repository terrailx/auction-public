<body><header class="top"><div class="title"><span class="crest" aria-hidden="true">⌖</span><div><p>전국 물건 공개 열람</p><h1>보유물건 위성지도</h1></div></div><div class="topmeta"><a href="/auction-public/auction/" class="auction-entry">경매 사건 자료 ↗</a><strong id="portfolioTotal">—</strong><div id="portfolioCoverage">자료 불러오는 중</div></div></header>

<div class="mapTools"><button id="overview" type="button">전체 위치</button><button id="road" type="button" aria-pressed="false">일반지도</button><button id="sky" type="button" aria-pressed="true">스카이뷰</button><button id="perspective" type="button" aria-pressed="false" disabled>3D 현장</button></div>

</div><div id="list"></div>
